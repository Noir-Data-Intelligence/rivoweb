# CI do front (§9.5). Actions fixadas por SHA (§7.7, S25).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run api:check
      # A cópia byte a byte da IV só se compara quando ../identidade existe; no CI fica o controlo de cores literais.
      - run: npm run tokens:check
      - run: npx vitest run --coverage
      - name: Build de produção + verificação do bundle
        run: npm run build
        env:
          VITE_API_URL: https://syyt.tech
      # Bloqueia em vulnerabilidades altas nas dependências que vão para o bundle.
      # As de build (Tailwind v3 → braces) ficam visíveis no passo seguinte, sem bloquear.
      - run: npm run audit:prod
      - run: npm audit --audit-level=critical
      - run: npm run licenses

  # Um job por motor, em paralelo: os três seguidos já passavam dos 25 minutos.
  # No contentor oficial do Playwright (navegadores e dependências já lá estão):
  # o `install --with-deps` pelo apt chegou a levar 21 minutos. A versão da
  # imagem acompanha a do @playwright/test; fixada por digest (§7.7).
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    env:
      # O Firefox recusa arrancar como root com outro HOME.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        motor: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build para o e2e (API simulada em localhost)
        run: npx vite build
        env:
          VITE_API_URL: http://localhost:5080
      - run: npx playwright test --project=${{ matrix.motor }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.motor }}
          path: playwright-report
          retention-days: 7
